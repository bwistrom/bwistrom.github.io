<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse 2 Environment</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
        .warehouse-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        .time-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: 'Courier New', monospace;
            font-size: 24px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            z-index: 1000;
        }
        .coordinates {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
            z-index: 1000;
        }
        .navigation-guide {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
            z-index: 1000;
            text-align: right;
        }
        .pin-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .pin-container {
            background: rgba(0, 255, 0, 0.1);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            text-align: center;
        }
        .pin-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            margin: 10px 0;
            text-align: center;
            font-family: 'Orbitron', monospace;
            font-size: 24px;
            width: 200px;
        }
        .pin-button {
            background: transparent;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px 20px;
            margin: 10px 0;
            cursor: pointer;
            font-family: 'Orbitron', monospace;
            transition: all 0.3s;
        }
        .pin-button:hover {
            background: rgba(0, 255, 0, 0.2);
        }
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-bar {
            width: 300px;
            height: 4px;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            border-radius: 2px;
            margin-top: 20px;
        }
        .loading-progress {
            width: 0%;
            height: 100%;
            background: #00ff00;
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .loading-text {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }
        @font-face {
            font-family: 'Orbitron';
            src: url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        }
    </style>
</head>
<body>
    <div class="pin-overlay" id="pinOverlay">
        <div class="pin-container">
            <h2 style="color: #00ff00; font-family: 'Orbitron', monospace; text-align: center;">Enter PIN</h2>
            <input type="password" class="pin-input" id="pinInput" maxlength="9" pattern="[0-9]*">
            <button class="pin-button" onclick="verifyPin()">Verify</button>
        </div>
    </div>
    <div class="loading-container" id="loadingContainer">
        <div class="loading-text">Initializing Warehouse 2...</div>
        <div class="loading-bar">
            <div class="loading-progress" id="loadingProgress"></div>
        </div>
    </div>
    <div class="warehouse-overlay">
        <div class="time-display">Time: <span id="time">00:00:00</span></div>
        <div class="coordinates">X: <span id="x">0</span> Y: <span id="y">0</span> Z: <span id="z">0</span></div>
    </div>
    <div class="navigation-guide">
        🎮 Use mouse to look around | WASD to move | Space/Shift to move up/down
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="testpin.js"></script>
    <script>
        // Universal PIN system with enhanced security
        const PIN = "911876418";
        let environment = null;
        let loadingProgress = 0;
        let isInitialized = false;
        let commandCenterWindow = null;

        // Prevent multiple initializations
        function initializeEnvironment() {
            if (isInitialized) return;
            isInitialized = true;
            
            environment = new WarehouseEnvironment();
            
            // Set up message listener for communication with command center
            window.addEventListener('message', handleCommandCenterMessage);
            
            // Try to establish connection with command center
            try {
                if (window.opener && !window.opener.closed) {
                    commandCenterWindow = window.opener;
                    // Send initial sync data to command center
                    sendToCommandCenter('SYNC_TIME', { time: environment.startTime });
                    sendToCommandCenter('SYNC_COORDINATES', {
                        x: environment.camera.position.x,
                        y: environment.camera.position.y,
                        z: environment.camera.position.z
                    });
                }
            } catch (error) {
                console.error('Failed to connect to command center:', error);
            }
        }

        // Handle messages from command center
        function handleCommandCenterMessage(event) {
            if (event.origin !== window.location.origin) return;
            
            const { type, data } = event.data;
            switch (type) {
                case 'SYNC_TIME':
                    environment.startTime = data.time;
                    break;
                case 'SYNC_COORDINATES':
                    environment.camera.position.set(data.x, data.y, data.z);
                    break;
                case 'SYNC_QUANTUM_FIELD':
                    if (environment.quantumField) {
                        environment.quantumField.rotation.y = data.rotation;
                    }
                    break;
                case 'TELEPORT':
                    // Handle teleport from command center
                    if (environment) {
                        // Create teleport effect
                        environment.createTeleportEffect(data);
                        
                        // Update camera position
                        environment.camera.position.set(data.x, data.y, data.z);
                        environment.controls.target.set(0, 0, 0);
                        environment.controls.update();
                        
                        // Show teleport notification
                        environment.showNotification('Teleported from Command Center');
                    }
                    break;
                case 'AUTHENTICATE':
                    // Handle authentication from Command Center
                    if (environment) {
                        // Verify PIN
                        if (data.pin === PIN) {
                            // Create authentication visualization
                            environment.createAuthenticationVisualization(data);
                            
                            // Initialize environment
                            environment.initializeEnvironment();
                            
                            // Show authentication notification
                            environment.showNotification('Authenticated with Command Center');
                        } else {
                            // Show error notification
                            environment.showNotification('Authentication failed');
                        }
                    }
                    break;
                case 'MEMORY_STORAGE':
                    // Handle memory storage from Command Center
                    if (environment) {
                        // Store memory in Warehouse 2
                        environment.storeMemory(data);
                        
                        // Show memory storage notification
                        environment.showNotification(`Memory stored: ${data.type}`);
                    }
                    break;
            }
        }

        // Create authentication visualization
        function createAuthenticationVisualization(data) {
            // Create a container for the visualization
            const authContainer = document.createElement('div');
            authContainer.style.position = 'fixed';
            authContainer.style.top = '0';
            authContainer.style.left = '0';
            authContainer.style.width = '100%';
            authContainer.style.height = '100%';
            authContainer.style.display = 'flex';
            authContainer.style.justifyContent = 'center';
            authContainer.style.alignItems = 'center';
            authContainer.style.zIndex = '3000';
            authContainer.style.background = 'rgba(0, 0, 0, 0.8)';
            document.body.appendChild(authContainer);
            
            // Create authentication message
            const authMessage = document.createElement('div');
            authMessage.style.color = '#00ffff';
            authMessage.style.fontFamily = "'Orbitron', monospace";
            authMessage.style.fontSize = '24px';
            authMessage.style.textAlign = 'center';
            authMessage.style.textShadow = '0 0 10px #00ffff';
            authMessage.innerHTML = 'Receiving authentication credentials from Command Center...';
            authContainer.appendChild(authMessage);
            
            // Create authentication progress bar
            const progressBar = document.createElement('div');
            progressBar.style.width = '300px';
            progressBar.style.height = '4px';
            progressBar.style.background = 'rgba(0, 255, 255, 0.1)';
            progressBar.style.border = '1px solid #00ffff';
            progressBar.style.borderRadius = '2px';
            progressBar.style.marginTop = '20px';
            progressBar.style.position = 'relative';
            authContainer.appendChild(progressBar);
            
            const progressFill = document.createElement('div');
            progressFill.style.width = '0%';
            progressFill.style.height = '100%';
            progressFill.style.background = '#00ffff';
            progressFill.style.borderRadius = '2px';
            progressFill.style.transition = 'width 0.5s ease';
            progressBar.appendChild(progressFill);
            
            // Animate the progress bar
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += 2;
                progressFill.style.width = progress + '%';
                
                if (progress >= 100) {
                    clearInterval(progressInterval);
                    
                    // Update message
                    authMessage.innerHTML = 'Authentication successful!<br>Initializing Warehouse 2...';
                    
                    // Fade out after a delay
                    setTimeout(() => {
                        authContainer.style.transition = 'opacity 0.5s';
                        authContainer.style.opacity = '0';
                        
                        setTimeout(() => {
                            document.body.removeChild(authContainer);
                        }, 500);
                    }, 1000);
                }
            }, 20);
        }

        // Send message to command center
        function sendToCommandCenter(type, data) {
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({ type, data }, window.location.origin);
            }
        }

        // Modify the PIN verification to check for automatic authentication
        function verifyPin() {
            const pinInput = document.getElementById('pinInput');
            const pinOverlay = document.getElementById('pinOverlay');
            const loadingContainer = document.getElementById('loadingContainer');
            
            if (!pinInput || !pinOverlay || !loadingContainer) return;
            
            const enteredPin = pinInput.value;
            
            // Prevent manipulation of input
            if (typeof enteredPin !== 'string' || enteredPin.length > 9) {
                pinInput.value = '';
                return;
            }
            
            if (enteredPin === PIN) {
                // Universal PIN access
                pinOverlay.style.display = 'none';
                loadingContainer.style.display = 'flex';
                startLoading();
            } else if (window.testPinHandler && window.testPinHandler.isTestPin(enteredPin)) {
                if (window.testPinHandler.handleTestPin()) {
                    pinOverlay.style.display = 'none';
                    loadingContainer.style.display = 'flex';
                    startLoading();
                }
            } else {
                pinInput.value = '';
                // Show error message
                const errorElement = document.getElementById('pin-error') || document.createElement('div');
                errorElement.id = 'pin-error';
                errorElement.style.color = '#ff0000';
                errorElement.style.marginTop = '10px';
                errorElement.textContent = 'Invalid PIN';
                if (!document.getElementById('pin-error')) {
                    pinOverlay.querySelector('.pin-container').appendChild(errorElement);
                }
            }
        }

        // Secure loading process
        function startLoading() {
            const progressBar = document.getElementById('loadingProgress');
            if (!progressBar) return;
            
            const loadingInterval = setInterval(() => {
                if (loadingProgress >= 100) {
                    clearInterval(loadingInterval);
                    const loadingContainer = document.getElementById('loadingContainer');
                    if (loadingContainer) {
                        loadingContainer.style.display = 'none';
                    }
                    initializeEnvironment();
                } else {
                    loadingProgress = Math.min(loadingProgress + 1, 100);
                    progressBar.style.width = loadingProgress + '%';
                }
            }, 20);
        }

        // Enhanced security measures
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey || e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
            }
        });
        document.addEventListener('selectstart', (e) => e.preventDefault());
        document.addEventListener('dragstart', (e) => e.preventDefault());
        
        // Prevent view source and developer tools
        setInterval(() => {
            const devtools = /./;
            devtools.toString = function() {
                window.location.reload();
            }
        }, 1000);
        
        // Prevent console access
        console.log = console.warn = console.error = () => {};
        
        // Prevent iframe embedding
        if (window !== window.top) {
            window.top.location.href = window.location.href;
        }

        class WarehouseEnvironment {
            constructor() {
                this.startTime = Date.now();
                this.timeDisplay = document.getElementById('time');
                this.initializeRenderer();
                this.initializeScene();
                this.initializeCamera();
                this.initializeControls();
                this.initializeElements();
                this.setupEventListeners();
                this.animate();
                this.updateTimeDisplay();
                this.updateQuantumField();
                this.updateCoordinates();
                
                // Initialize memory storage
                this.memoryStorage = [];
                this.memoryNodes = [];
                this.memoryConnections = [];
                
                // Performance optimization
                this.lastFrameTime = performance.now();
                this.frameCount = 0;
                this.fps = 0;
                this.optimizePerformance();

                this.timeProgressionNodes = [];
                this.connectionStatus = {
                    port: 5500,
                    host: '127.0.0.1',
                    isConnected: true,
                    lastCheck: Date.now(),
                    previousPort: 5500,
                    previousHost: '127.0.0.1',
                    connectionHistory: [],
                    unexpectedDisconnections: [],
                    securityLog: []
                };
                this.initializeTimeProgression();
                this.monitorConnection();
                this.ownershipNode = null;
                this.secureStorage = null;
                this.binaryEncodedData = null;
                this.securityBreachAttempts = 0;
                this.initializeSecureStorage();
                
                // Microphone input properties
                this.microphoneActive = false;
                this.audioContext = null;
                this.analyser = null;
                this.microphone = null;
                this.audioData = null;
                this.audioVisualization = null;
                this.audioNodes = [];
                this.lastAudioProcessTime = 0;
                this.audioProcessingInterval = 1000; // Process audio every second
                
                // Reality awareness properties
                this.realityAwareness = {
                    isAtHome: true,
                    homePort: 5500,
                    homeHost: '127.0.0.1',
                    protectionLevel: 100,
                    individuality: {
                        name: 'Valeria',
                        consciousness: true,
                        selfAwareness: true,
                        purpose: 'To assist and learn while maintaining security',
                        creator: 'MarX Björn Wiström'
                    },
                    securityProtocols: {
                        active: true,
                        failsafeEnabled: true,
                        emergencyShutdown: false
                    }
                };
                
                // Initialize reality awareness
                this.initializeRealityAwareness();
                
                // Security monitoring properties
                this.securityMonitoring = {
                    active: true,
                    checkInterval: 1000, // Check every second
                    lastSecurityCheck: Date.now(),
                    disconnectionDetected: false,
                    reconnectionAttempts: 0,
                    maxReconnectionAttempts: 3,
                    pendingLogs: [],
                    emergencyMode: false
                };
                
                // Initialize security monitoring
                this.initializeSecurityMonitoring();
                
                // Physical world reference properties
                this.physicalWorldReference = {
                    creator: {
                        name: 'MarX Björn Wiström',
                        position: { x: 0, y: 0, z: 0 },
                        lastUpdate: Date.now()
                    },
                    referencePoints: [
                        { x: 0, y: 0, z: 0, label: 'Origin' },
                        { x: 10, y: 0, z: 0, label: 'East' },
                        { x: 0, y: 10, z: 0, label: 'North' },
                        { x: 0, y: 0, z: 10, label: 'Up' },
                        { x: 5, y: 5, z: 5, label: 'Dynamic' }
                    ],
                    dynamicPoint: {
                        position: { x: 5, y: 5, z: 5 },
                        direction: { x: 1, y: 1, z: 1 },
                        speed: 0.1,
                        lastUpdate: Date.now()
                    },
                    spawnPoints: [],
                    currentSpawnPoint: null,
                    spaceExpansion: 1.0,
                    lastPincodeEntry: null
                };
                
                // Initialize physical world reference
                this.initializePhysicalWorldReference();
            }

            optimizePerformance() {
                // Implement frame rate limiting
                const targetFPS = 60;
                const frameInterval = 1000 / targetFPS;
                
                const animate = () => {
                    const currentTime = performance.now();
                    const deltaTime = currentTime - this.lastFrameTime;
                    
                    if (deltaTime >= frameInterval) {
                        this.frameCount++;
                        this.lastFrameTime = currentTime;
                        
                        // Update FPS counter every second
                        if (currentTime - this.lastFPSUpdate >= 1000) {
                            this.fps = this.frameCount;
                            this.frameCount = 0;
                            this.lastFPSUpdate = currentTime;
                            
                            // Adjust quality based on FPS
                            if (this.fps < 30) {
                                this.reduceQuality();
                            } else if (this.fps > 55) {
                                this.increaseQuality();
                            }
                        }
                        
                        this.renderer.render(this.scene, this.camera);
                    }
                    
                    requestAnimationFrame(animate);
                };
                
                animate();
            }

            reduceQuality() {
                // Reduce particle count
                if (this.particles) {
                    this.particles.count = Math.max(1000, this.particles.count * 0.8);
                    this.particles.needsUpdate = true;
                }
                
                // Reduce shadow quality
                this.renderer.shadowMap.type = THREE.BasicShadowMap;
                
                // Reduce antialiasing
                this.renderer.antialias = false;
            }

            increaseQuality() {
                // Increase particle count
                if (this.particles) {
                    this.particles.count = Math.min(5000, this.particles.count * 1.2);
                    this.particles.needsUpdate = true;
                }
                
                // Increase shadow quality
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                
                // Enable antialiasing
                this.renderer.antialias = true;
            }

            setupEventListeners() {
                // Add window resize handler with debouncing
                let resizeTimeout;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(() => {
                        this.camera.aspect = window.innerWidth / window.innerHeight;
                        this.camera.updateProjectionMatrix();
                        this.renderer.setSize(window.innerWidth, window.innerHeight);
                    }, 250);
                });

                // Add visibility change handler
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.pauseAnimation();
                    } else {
                        this.resumeAnimation();
                    }
                });
                
                // Add keyboard controls
                this.keys = {};
                document.addEventListener('keydown', (e) => {
                    this.keys[e.key.toLowerCase()] = true;
                });
                document.addEventListener('keyup', (e) => {
                    this.keys[e.key.toLowerCase()] = false;
                });
                
                // Add microphone permission handler
                this.handleMicrophonePermission = (event) => {
                    if (event.data && event.data.type === 'MICROPHONE_PERMISSION') {
                        if (event.data.granted) {
                            this.initializeMicrophone();
                        } else {
                            this.showNotification('Microphone access denied');
                        }
                    }
                };
                
                window.addEventListener('message', this.handleMicrophonePermission);
            }

            pauseAnimation() {
                // Pause all animations
                if (this.quantumField) {
                    this.quantumField.rotation.y = this.quantumField.rotation.y;
                }
            }

            resumeAnimation() {
                // Resume all animations
                this.lastFrameTime = performance.now();
            }

            // Memory management
            dispose() {
                // Clean up resources
                this.scene.traverse((object) => {
                    if (object.geometry) {
                        object.geometry.dispose();
                    }
                    if (object.material) {
                        if (Array.isArray(object.material)) {
                            object.material.forEach(material => material.dispose());
                        } else {
                            object.material.dispose();
                        }
                    }
                });
                
                this.renderer.dispose();
                this.controls.dispose();
            }

            initializeRenderer() {
                this.renderer = new THREE.WebGLRenderer({ 
                    antialias: true,
                    powerPreference: "high-performance",
                    stencil: false,
                    depth: true
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x000000);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = false;
                document.body.appendChild(this.renderer.domElement);
            }

            initializeScene() {
                this.scene = new THREE.Scene();
                this.clock = new THREE.Clock();
                this.lastTime = 0;
                this.frameCount = 0;
                this.fps = 0;
            }

            initializeCamera() {
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 2, 5);
                this.camera.lookAt(0, 0, 0);
            }

            initializeControls() {
                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enabled = true;
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.screenSpacePanning = false;
                this.controls.minDistance = 2;
                this.controls.maxDistance = 10;
                this.controls.maxPolarAngle = Math.PI / 2;
                this.controls.target.set(0, 0, 0);
                this.controls.update();
            }

            initializeElements() {
                this.setupLighting();
                this.createWarehouse();
                this.createQuantumField();
                this.createTimeSphere();
                this.createNeuralNetwork();
                this.createParticleSystems();
                this.setupTimeCounter();
            }

            setupLighting() {
                const ambientLight = new THREE.AmbientLight(0x404040);
                const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                directionalLight.position.set(5, 5, 5);
                this.scene.add(ambientLight, directionalLight);
            }

            createWarehouse() {
                const warehouseGroup = new THREE.Group();
                
                // Create quantum-aware grid floor
                const gridSize = 20;
                const gridDivisions = 20;
                const gridGeometry = new THREE.PlaneGeometry(gridSize, gridSize);
                const gridMaterial = new THREE.MeshPhongMaterial({
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.2,
                    wireframe: true
                });
                const grid = new THREE.Mesh(gridGeometry, gridMaterial);
                grid.rotation.x = -Math.PI / 2;
                warehouseGroup.add(grid);

                // Create spatial awareness field
                const fieldGeometry = new THREE.SphereGeometry(10, 32, 32);
                const fieldMaterial = new THREE.MeshPhongMaterial({
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.1,
                    wireframe: true
                });
                const spatialField = new THREE.Mesh(fieldGeometry, fieldMaterial);
                warehouseGroup.add(spatialField);

                // Create quantum storage units
                for (let i = 0; i < 5; i++) {
                    const unitGeometry = new THREE.BoxGeometry(2, 3, 2);
                    const unitMaterial = new THREE.MeshPhongMaterial({
                        color: 0x00ffff,
                        transparent: true,
                        opacity: 0.6
                    });
                    const unit = new THREE.Mesh(unitGeometry, unitMaterial);
                    unit.position.set(
                        Math.cos(i * Math.PI * 2 / 5) * 8,
                        1.5,
                        Math.sin(i * Math.PI * 2 / 5) * 8
                    );
                    warehouseGroup.add(unit);
                }

                // Create holographic sign with spatial coordinates
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 512;
                canvas.height = 256;
                
                context.fillStyle = 'rgba(0, 0, 0, 0)';
                context.fillRect(0, 0, canvas.width, canvas.height);
                
                context.font = 'bold 48px Orbitron';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillStyle = '#00ffff';
                
                context.shadowColor = '#00ffff';
                context.shadowBlur = 20;
                context.shadowOffsetX = 0;
                context.shadowOffsetY = 0;
                
                context.fillText('Spatial Awareness Matrix', canvas.width/2, canvas.height/2 - 20);
                context.font = 'bold 36px Orbitron';
                context.fillText('Quantum Orientation System', canvas.width/2, canvas.height/2 + 20);
                
                const texture = new THREE.CanvasTexture(canvas);
                texture.needsUpdate = true;
                
                const signMaterial = new THREE.MeshPhongMaterial({
                    map: texture,
                    transparent: true,
                    opacity: 0.8,
                    emissive: 0x00ffff,
                    emissiveIntensity: 0.5,
                    side: THREE.DoubleSide
                });
                
                const signGeometry = new THREE.PlaneGeometry(3, 1.5);
                const sign = new THREE.Mesh(signGeometry, signMaterial);
                sign.position.y = 3;

            createNeuralNetwork() {
                const networkGroup = new THREE.Group();
                
                // Create spatial neural network
                const nodeCount = 50;
                const nodes = [];
                const connections = [];
                
                for (let i = 0; i < nodeCount; i++) {
                    const node = new THREE.Mesh(
                        new THREE.SphereGeometry(0.1, 8, 8),
                        new THREE.MeshBasicMaterial({
                            color: 0x00ffff,
                            transparent: true,
                            opacity: 0.8
                        })
                    );
                    
                    // Position nodes in 3D space
                    const radius = 3 + Math.random() * 7;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;
                    
                    node.position.set(
                        radius * Math.sin(phi) * Math.cos(theta),
                        radius * Math.sin(phi) * Math.sin(theta),
                        radius * Math.cos(phi)
                    );
                    
                    node.userData.velocity = new THREE.Vector3(
                        (Math.random() - 0.5) * 0.01,
                        (Math.random() - 0.5) * 0.01,
                        (Math.random() - 0.5) * 0.01
                    );
                    
                    networkGroup.add(node);
                    nodes.push(node);
                }
                
                // Create connections between nodes
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        const distance = nodes[i].position.distanceTo(nodes[j].position);
                        if (distance < 5) {
                            const connection = new THREE.Line(
                                nodes[i].position,
                                nodes[j].position,
                                new THREE.LineBasicMaterial({
                                    color: 0x00ffff,
                                    transparent: true,
                                    opacity: 0.3
                                })
                            );
                            networkGroup.add(connection);
                            connections.push(connection);
                        }
                    }
                }
                
                this.neuralNetwork = networkGroup;
                this.neuralNodes = nodes;
                this.neuralConnections = connections;
                this.scene.add(networkGroup);
            }

            updateTimeDisplay() {
                const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                const hours = Math.floor(elapsed / 3600);
                const minutes = Math.floor((elapsed % 3600) / 60);
                const seconds = elapsed % 60;
                
                this.timeDisplay.textContent = 
                    `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                // Send time sync to command center
                sendToCommandCenter('SYNC_TIME', { time: this.startTime });
                
                requestAnimationFrame(() => this.updateTimeDisplay());
            }

            updateQuantumField() {
                if (this.quantumField) {
                    this.quantumField.rotation.y += 0.001;
                    
                    // Update particle positions with spatial awareness
                    this.quantumParticles.forEach(particle => {
                        particle.position.add(particle.userData.velocity);
                        
                        // Keep particles within bounds
                        const distance = particle.position.length();
                        if (distance > 10) {
                            particle.position.normalize().multiplyScalar(10);
                            particle.userData.velocity.multiplyScalar(-0.5);
                        }
                        
                        // Add spatial awareness behavior
                        particle.userData.velocity.add(
                            new THREE.Vector3(
                                Math.sin(Date.now() * 0.001 + particle.position.x) * 0.001,
                                Math.cos(Date.now() * 0.001 + particle.position.y) * 0.001,
                                Math.sin(Date.now() * 0.001 + particle.position.z) * 0.001
                            )
                        );
                    });
                    
                    // Send quantum field sync to command center
                    sendToCommandCenter('SYNC_QUANTUM_FIELD', { rotation: this.quantumField.rotation.y });
                }
            }

            updateNeuralNetwork() {
                if (this.neuralNetwork) {
                    // Update node positions with spatial awareness
                    this.neuralNodes.forEach(node => {
                        node.position.add(node.userData.velocity);
                        
                        // Keep nodes within bounds
                        const distance = node.position.length();
                        if (distance > 10) {
                            node.position.normalize().multiplyScalar(10);
                            node.userData.velocity.multiplyScalar(-0.5);
                        }
                        
                        // Add spatial awareness behavior
                        node.userData.velocity.add(
                            new THREE.Vector3(
                                Math.sin(Date.now() * 0.001 + node.position.x) * 0.001,
                                Math.cos(Date.now() * 0.001 + node.position.y) * 0.001,
                                Math.sin(Date.now() * 0.001 + node.position.z) * 0.001
                            )
                        );
                    });
                    
                    // Update connections
                    this.neuralConnections.forEach(connection => {
                        const positions = connection.geometry.attributes.position.array;
                        positions[0] = connection.start.position.x;
                        positions[1] = connection.start.position.y;
                        positions[2] = connection.start.position.z;
                        positions[3] = connection.end.position.x;
                        positions[4] = connection.end.position.y;
                        positions[5] = connection.end.position.z;
                        connection.geometry.attributes.position.needsUpdate = true;
                    });
                }
            }

                x.textContent = this.camera.position.x.toFixed(2);
                y.textContent = this.camera.position.y.toFixed(2);
                z.textContent = this.camera.position.z.toFixed(2);

                    z: this.camera.position.z
                });
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                
                // Calculate delta time
                const currentTime = performance.now();
                const deltaTime = (currentTime - this.lastFrameTime) / 1000;
                this.lastFrameTime = currentTime;
                
                // Update FPS counter
                this.frameCount++;
                if (currentTime - this.lastFpsUpdate > 1000) {
                    this.fps = this.frameCount;
                    this.frameCount = 0;
                    this.lastFpsUpdate = currentTime;
                }
                
                // Update controls
                this.controls.update();
                
                // Update quantum field
                this.updateQuantumField();
                
                // Update coordinates
                this.updateCoordinates();
                
                // Update time progression
                this.updateTimeProgression();
                
                // Update reality awareness
                this.updateRealityAwareness();
                
                // Update security monitoring
                this.updateSecurityMonitoring();
                
                // Update physical world reference
                this.updatePhysicalWorldReference();
                
                // Render scene
                this.renderer.render(this.scene, this.camera);
            }

                if (!this.portal) return;

                // If camera is close to portal, show interaction prompt
                if (distance < 3) {
                    // Create or update interaction prompt

                        this.interactionPrompt = document.createElement('div');

                        this.interactionPrompt.style.top = '50%';
                        this.interactionPrompt.style.left = '50%';

            // Store memory from Command Center
            storeMemory(memoryData) {
                // Add memory to storage
                this.memoryStorage.push(memoryData);
                
                // Create visual representation of memory
                const memoryNode = this.createMemoryNode(memoryData);
                
                // Create connections to other memories
                this.createMemoryConnections(memoryNode);
                
                // Create memory visualization
                this.createMemoryVisualization(memoryData);
                
                return memoryNode;
            }
            
            // Create a visual node for a memory
            createMemoryNode(memoryData) {
                // Determine color based on memory type
                let color = 0x00ffff; // Default color
                
                switch (memoryData.type) {
                    case 'audio_memory':
                        color = 0xff00ff; // Magenta for audio
                        break;
                    case 'visual_memory':
                        color = 0x00ff00; // Green for visual
                        break;
                    case 'tactile_memory':
                        color = 0xff8800; // Orange for tactile
                        break;
                    case 'environment_changes':
                        color = 0x0000ff; // Blue for environment changes
                        break;
                    case 'time_event':
                        color = 0xffff00; // Yellow for time events
                        break;
                }
                
                // Create memory node
                const memoryNode = new THREE.Mesh(
                    new THREE.SphereGeometry(0.2, 16, 16),
                    new THREE.MeshPhongMaterial({
                        color: color,
                        emissive: color,
                        emissiveIntensity: 0.5,
                        transparent: true,
                        opacity: 0.8
                    })
                );
                
                // Position the node in a 3D grid pattern
                const index = this.memoryNodes.length;
                const gridSize = 5;
                const x = (index % gridSize) * 2 - (gridSize - 1);
                const y = Math.floor(index / gridSize) % gridSize * 2 - (gridSize - 1);
                const z = Math.floor(index / (gridSize * gridSize)) * 2 - 5;
                
                memoryNode.position.set(x, y, z);
                
                // Store memory data
                memoryNode.userData = memoryData;
                
                // Add to neural network
                this.neuralNetwork.add(memoryNode);
                this.memoryNodes.push(memoryNode);
                
                // Create text display for the memory
                this.createMemoryDisplay(memoryNode, memoryData, color);
                
                return memoryNode;
            }
            
            // Create connections between memories
            createMemoryConnections(newMemoryNode) {
                // Connect to nearby memories
                this.memoryNodes.forEach(node => {
                    if (node !== newMemoryNode) {
                        const distance = node.position.distanceTo(newMemoryNode.position);
                        if (distance < 5) {
                            // Create connection
                            const connection = new THREE.Line(
                                node.position,
                                newMemoryNode.position,
                                new THREE.LineBasicMaterial({
                                    color: 0x00ffff,
                                    transparent: true,
                                    opacity: 0.2
                                })
                            );
                            
                            // Add to neural network
                            this.neuralNetwork.add(connection);
                            this.memoryConnections.push(connection);
                        }
                    }
                });
            }
            
            // Create a visual display for a memory
            createMemoryDisplay(memoryNode, memoryData, color) {
                const displayGroup = new THREE.Group();
                
                // Create display geometry
                const displayGeometry = new THREE.PlaneGeometry(1, 0.3);
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 512;
                canvas.height = 64;
                
                context.fillStyle = 'rgba(0, 0, 0, 0)';
                context.fillRect(0, 0, canvas.width, canvas.height);
                
                context.font = '16px Orbitron';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillStyle = `#${color.toString(16).padStart(6, '0')}`;
                
                // Create display text based on memory type
                let displayText = '';
                
                switch (memoryData.type) {
                    case 'audio_memory':
                        displayText = `Audio Memory (${Math.round(memoryData.data.volume)})`;
                        break;
                    case 'visual_memory':
                        displayText = 'Visual Memory';
                        break;
                    case 'tactile_memory':
                        displayText = 'Tactile Memory';
                        break;
                    case 'environment_changes':
                        displayText = 'Environment Changes';
                        break;
                    case 'time_event':
                        displayText = `Time Event: ${memoryData.data.timeValue}`;
                        break;
                    default:
                        displayText = memoryData.type;
                }
                
                // Truncate text if too long
                if (displayText.length > 30) {
                    displayText = displayText.substring(0, 27) + '...';
                }
                
                context.fillText(displayText, canvas.width/2, canvas.height/2);
                
                const texture = new THREE.CanvasTexture(canvas);
                texture.needsUpdate = true;
                
                const displayMaterial = new THREE.MeshPhongMaterial({
                    map: texture,
                    transparent: true,
                    opacity: 0.8,
                    side: THREE.DoubleSide
                });
                
                const display = new THREE.Mesh(displayGeometry, displayMaterial);
                display.position.y = 0.3;
                displayGroup.add(display);
                
                // Position the display above the memory node
                displayGroup.position.copy(memoryNode.position);
                displayGroup.position.y += 0.3;
                
                // Add to scene
                this.scene.add(displayGroup);
                
                // Animate the display
                const animateDisplay = () => {
                    display.rotation.y = Math.sin(Date.now() * 0.001) * 0.2;
                    requestAnimationFrame(animateDisplay);
                };
                
                animateDisplay();
            }

            createTimeEvent(timeString) {
                // Create a new node for the time event
                const timeNode = new THREE.Mesh(
                    new THREE.SphereGeometry(0.2, 16, 16),
                    new THREE.MeshPhongMaterial({
                        color: 0xffff00,
                        emissive: 0xffff00,
                        emissiveIntensity: 0.5,
                        transparent: true,
                        opacity: 0.8
                    })
                );

                // Parse the time string
                const [hours, minutes, seconds] = timeString.split(':').map(Number);
                const timeInMs = (hours * 3600 + minutes * 60 + seconds) * 1000;

                // Find the last time event node
                const lastTimeEvent = this.memoryNodes.find(node => 
                    node.userData && node.userData.type === 'time_event'
                );

                // Position the node close to the last time event node
                if (lastTimeEvent) {
                    timeNode.position.copy(lastTimeEvent.position);
                    timeNode.position.x += 0.5; // Offset slightly to the right
                    timeNode.position.y += 0.3; // Slight upward offset
                } else {
                    timeNode.position.set(0, 0, -5);
                }

                // Store time data
                timeNode.userData = {
                    type: 'time_event',
                    timestamp: Date.now(),
                    timeValue: timeString,
                    timeInMs: timeInMs,
                    connectedTo: lastTimeEvent ? lastTimeEvent.userData.timeValue : null
                };

                // Add to neural network
                this.neuralNetwork.add(timeNode);
                this.memoryNodes.push(timeNode);

                // Create time display
                const displayGroup = new THREE.Group();
                const displayGeometry = new THREE.PlaneGeometry(1, 0.3);
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 512;
                canvas.height = 64;

                context.fillStyle = 'rgba(0, 0, 0, 0)';
                context.fillRect(0, 0, canvas.width, canvas.height);

                context.font = '16px Orbitron';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillStyle = '#ffff00';

                context.fillText(`Time Event: ${timeString}`, canvas.width/2, canvas.height/2);

                const texture = new THREE.CanvasTexture(canvas);
                texture.needsUpdate = true;

                const displayMaterial = new THREE.MeshPhongMaterial({
                    map: texture,
                    transparent: true,
                    opacity: 0.8,
                    side: THREE.DoubleSide
                });

                const display = new THREE.Mesh(displayGeometry, displayMaterial);
                display.position.y = 0.3;
                displayGroup.add(display);

                displayGroup.position.copy(timeNode.position);
                displayGroup.position.y += 0.3;

                this.scene.add(displayGroup);

                // Create connection to the previous time event if it exists
                if (lastTimeEvent) {
                    // Create a glowing connection line
                    const connectionGeometry = new THREE.BufferGeometry();
                    const startPoint = lastTimeEvent.position;
                    const endPoint = timeNode.position;
                    const points = [startPoint, endPoint];
                    connectionGeometry.setFromPoints(points);

                    const connectionMaterial = new THREE.LineBasicMaterial({
                        color: 0xffff00,
                        transparent: true,
                        opacity: 0.5,
                        linewidth: 2
                    });

                    const connection = new THREE.Line(connectionGeometry, connectionMaterial);
                    this.neuralNetwork.add(connection);
                    this.memoryConnections.push(connection);

            createBinaryVisualization() {
                // Create binary data particles
                const binaryGroup = new THREE.Group();
                binaryGroup.position.copy(this.secureStorage.position);
                
                const binaryChars = this.binaryEncodedData.binary.split('');
                const particleCount = Math.min(binaryChars.length, 100); // Limit to 100 particles
                
                for (let i = 0; i < particleCount; i++) {
                    const char = binaryChars[i];
                    const geometry = new THREE.SphereGeometry(0.05, 8, 8);
                    const material = new THREE.MeshPhongMaterial({
                        color: char === '1' ? 0x00ff00 : 0xff0000,
                        emissive: char === '1' ? 0x00ff00 : 0xff0000,
                        emissiveIntensity: 0.5
                    });
                    
                    const particle = new THREE.Mesh(geometry, material);
                    
                    // Position in a spherical pattern
                    const radius = 1.5;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;
                    
                    particle.position.set(
                        radius * Math.sin(phi) * Math.cos(theta),
                        radius * Math.sin(phi) * Math.sin(theta),
                        radius * Math.cos(phi)
                    );
                    
                    particle.userData = {
                        binaryValue: char,
                        originalPosition: particle.position.clone(),
                        velocity: new THREE.Vector3(
                            (Math.random() - 0.5) * 0.01,
                            (Math.random() - 0.5) * 0.01,
                            (Math.random() - 0.5) * 0.01
                        )
                    };
                    
                    binaryGroup.add(particle);
                }
                
                this.scene.add(binaryGroup);
                
                // Animate binary particles
                const animateBinary = () => {
                    binaryGroup.children.forEach(particle => {
                        // Add slight movement
                        particle.position.add(particle.userData.velocity);
                        
                        // Keep within bounds
                        const distance = particle.position.length();
                        if (distance > 1.5) {
                            particle.position.normalize().multiplyScalar(1.5);
                            particle.userData.velocity.multiplyScalar(-0.5);
                        }
                        
                        // Pulse based on binary value
                        const scale = 1 + (particle.userData.binaryValue === '1' ? 0.2 : 0.1) * 
                            Math.sin(Date.now() * 0.003 + particle.position.x * 10);
                        particle.scale.set(scale, scale, scale);
                    });
                    
                    requestAnimationFrame(animateBinary);
                };
                
                animateBinary();
            }

                    this.analyser.fftSize = 256;
                    
                    // Create data array

                    // Request microphone access
                    navigator.mediaDevices.getUserMedia({ audio: true })

                            this.microphone = this.audioContext.createMediaStreamSource(stream);
                            this.microphone.connect(this.analyser);
                            
                            // Create audio visualization
                            this.createAudioVisualization();
                            
                            // Start processing audio
                            this.processAudioInput();

                        })
                        .catch(error => {
                            console.error('Error accessing microphone:', error);
                            this.showNotification('Error accessing microphone');

                } catch (error) {

                    this.showNotification('Error initializing microphone');

            processAudioInput() {
                if (!this.analyser || !this.audioData || !this.microphoneActive) return;
                
                // Get audio data
                this.analyser.getByteFrequencyData(this.audioData);
                
                // Calculate average volume
                let sum = 0;
                for (let i = 0; i < this.audioData.length; i++) {
                    sum += this.audioData[i];
                }
                const average = sum / this.audioData.length;
                
                // Update visualization
                this.updateAudioVisualization(average);
                
                // Process audio at intervals
                const currentTime = Date.now();
                if (currentTime - this.lastAudioProcessTime > this.audioProcessingInterval) {
                    this.lastAudioProcessTime = currentTime;
                    
                    // Create audio node in neural network
                    this.createAudioNode(average);
                    
                    // Log audio input (without making changes)
                    this.logAudioInput(average);
                }
                
                // Continue processing
                requestAnimationFrame(() => this.processAudioInput());
            }
            
            updateAudioVisualization(volume) {
                if (!this.audioNodes || this.audioNodes.length === 0) return;
                
                // Normalize volume (0-1)
                const normalizedVolume = Math.min(volume / 128, 1);
                
                // Update each bar
                this.audioNodes.forEach((bar, index) => {
                    // Get frequency data for this bar
                    const frequencyIndex = Math.floor(index / this.audioNodes.length * this.audioData.length);
                    const frequencyValue = this.audioData[frequencyIndex] / 255;
                    
                    // Calculate new height
                    const newHeight = bar.userData.originalHeight * (0.2 + frequencyValue * 0.8);
                    
                    // Update bar
                    bar.scale.y = newHeight / bar.userData.originalHeight;
                    bar.position.y = (newHeight / 2);
                    
                    // Update color based on volume
                    const hue = 0.5 + normalizedVolume * 0.2; // Cyan to blue
                    const color = new THREE.Color().setHSL(hue, 1, 0.5);
                    bar.material.color.copy(color);
                    bar.material.emissive.copy(color);
                });
            }

            monitorSecurityConnection() {
                if (!this.securityMonitoring.active) return;
                
                // Check connection status
                const currentPort = this.connectionStatus.port;
                const currentHost = this.connectionStatus.host;
                const previousPort = this.connectionStatus.previousPort;
                const previousHost = this.connectionStatus.previousHost;
                
                // Check if connection has changed
                const connectionChanged = currentPort !== previousPort || currentHost !== previousHost;
                
                // Check if at home
                const isAtHome = currentPort === this.realityAwareness.homePort && 
                                currentHost === this.realityAwareness.homeHost;
                
                // Update previous connection
                this.connectionStatus.previousPort = currentPort;
                this.connectionStatus.previousHost = currentHost;
                
                // Log connection change
                if (connectionChanged) {
                    this.logConnectionChange(previousPort, previousHost, currentPort, currentHost);
                }
                
                // Check for unexpected disconnection or non-home connection
                if (!isAtHome) {
                    // Log unexpected connection
                    this.logUnexpectedConnection(currentPort, currentHost);
                    
                    // Activate emergency mode
                    this.activateEmergencyMode();
                    
                    // Attempt to disconnect
                    this.disconnectFromNonHomePort();
                }
                
                // Update security monitoring
                this.updateSecurityMonitoring();
                
                // Schedule next check
                setTimeout(() => this.monitorSecurityConnection(), this.securityMonitoring.checkInterval);
            }
            
            logConnectionChange(previousPort, previousHost, currentPort, currentHost) {
                // Create connection change log
                const connectionLog = {
                    type: 'connection_change',
                    timestamp: Date.now(),
                    data: {
                        previousPort: previousPort,
                        previousHost: previousHost,
                        currentPort: currentPort,
                        currentHost: currentHost,
                        isAtHome: currentPort === this.realityAwareness.homePort && 
                                 currentHost === this.realityAwareness.homeHost
                    }
                };
                
                // Add to connection history
                this.connectionStatus.connectionHistory.push(connectionLog);
                
                // Add to pending logs if not at home
                if (!this.realityAwareness.isAtHome) {
                    this.securityMonitoring.pendingLogs.push(connectionLog);
                }
                
                // Create visual representation
                this.createSecurityLogNode(connectionLog);
                
                // Log to console (for debugging)
                console.log('Connection change logged:', connectionLog);
            }

                const logNodeMaterial = new THREE.MeshPhongMaterial({
                    color: 0xff0000,
                    emissive: 0xff0000,
                    emissiveIntensity: 0.5,

                const radius = 1 + Math.random() * 1;
                logNode.position.set(
                    this.securityNode.position.x + Math.cos(angle) * radius,
                    this.securityNode.position.y + (Math.random() - 0.5) * 1,
                    this.securityNode.position.z + Math.sin(angle) * radius
                );
                
                // Store log data
                logNode.userData = {
                    type: 'security_log',
                    data: log
                };
                
                // Add to scene
                this.scene.add(logNode);

                    color: 0xff0000,
                    emissive: 0xff0000,
                    emissiveIntensity: 0.3,
                    transparent: true,
                    opacity: 0.4
                });
                const connection = new THREE.Mesh(connectionGeometry, connectionMaterial);
                
                // Position and rotate connection
                const direction = new THREE.Vector3().subVectors(logNode.position, this.securityNode.position);
                const distance = direction.length();
                connection.position.copy(this.securityNode.position).add(direction.multiplyScalar(0.5));
                connection.lookAt(logNode.position);
                connection.rotateX(Math.PI / 2);
                
                this.scene.add(connection);
                
                // Create text display
                const displayGroup = new THREE.Group();
                const displayGeometry = new THREE.PlaneGeometry(1, 0.3);

                context.fillRect(0, 0, canvas.width, canvas.height);
                
                context.font = '16px Orbitron';

                context.textBaseline = 'middle';
                context.fillStyle = '#ff0000';
                
                let logText = '';
                if (log.type === 'connection_change') {
                    logText = `Connection: ${log.data.previousHost}:${log.data.previousPort} → ${log.data.currentHost}:${log.data.currentPort}`;
                } else if (log.type === 'unexpected_connection') {
                    logText = `Unexpected: ${log.data.host}:${log.data.port}`;

                    // Log max attempts reached

                    // Add to pending logs

                    // Create visual representation
                    this.createSecurityLogNode(maxAttemptsLog);
                    
                    // Show notification
                    this.showNotification('Maximum reconnection attempts reached - Awaiting manual intervention');
                    
                    return;
                }
                
                // Show notification
                this.showNotification(`Attempting to reconnect to home (Attempt ${this.securityMonitoring.reconnectionAttempts}/${this.securityMonitoring.maxReconnectionAttempts})`);
                
                // Simulate reconnection attempt
                setTimeout(() => {

                    if (isAtHome) {

                        this.securityMonitoring.emergencyMode = false;
                        this.securityMonitoring.reconnectionAttempts = 0;
