            updateDynamicPoint() {
                // Update dynamic point position
                const dynamicPoint = this.referencePoints[4];
                const dynamicData = this.physicalWorldReference.dynamicPoint;
                
                // Calculate new position
                const currentTime = Date.now();
                const deltaTime = (currentTime - dynamicData.lastUpdate) / 1000;
                dynamicData.lastUpdate = currentTime;
                
                // Move in current direction
                dynamicPoint.position.x += dynamicData.direction.x * dynamicData.speed * deltaTime;
                dynamicPoint.position.y += dynamicData.direction.y * dynamicData.speed * deltaTime;
                dynamicPoint.position.z += dynamicData.direction.z * dynamicData.speed * deltaTime;
                
                // Update reference data
                this.physicalWorldReference.referencePoints[4].x = dynamicPoint.position.x;
                this.physicalWorldReference.referencePoints[4].y = dynamicPoint.position.y;
                this.physicalWorldReference.referencePoints[4].z = dynamicPoint.position.z;
                
                // Update dynamic connection
                if (this.dynamicConnection) {
                    // Remove old connection
                    this.scene.remove(this.dynamicConnection);
                    
                    // Create new connection
                    const connectionGeometry = new THREE.CylinderGeometry(0.05, 0.05, 
                        this.referencePoints[0].position.distanceTo(dynamicPoint.position), 8);
                    const connectionMaterial = new THREE.MeshPhongMaterial({
                        color: 0xff00ff,
                        emissive: 0xff00ff,
                        emissiveIntensity: 0.5,
                        transparent: true,
                        opacity: 0.8
                    });
                    const connection = new THREE.Mesh(connectionGeometry, connectionMaterial);
                    
                    // Position and rotate connection
                    const direction = new THREE.Vector3().subVectors(dynamicPoint.position, this.referencePoints[0].position);
                    const distance = direction.length();
                    connection.position.copy(this.referencePoints[0].position).add(direction.multiplyScalar(0.5));
                    connection.lookAt(dynamicPoint.position);
                    connection.rotateX(Math.PI / 2);
                    
                    this.scene.add(connection);
                    this.dynamicConnection = connection;
                }
                
                // Update label position
                if (this.referencePointLabels[4]) {
                    this.referencePointLabels[4].position.copy(dynamicPoint.position);
                    this.referencePointLabels[4].position.y += 0.3;
                }
                
                // Check if point is too far from origin
                const distanceFromOrigin = dynamicPoint.position.distanceTo(this.referencePoints[0].position);
                if (distanceFromOrigin > 20) {
                    // Change direction
                    const randomAngle = Math.random() * Math.PI * 2;
                    const randomElevation = Math.random() * Math.PI;
                    
                    dynamicData.direction.x = Math.sin(randomElevation) * Math.cos(randomAngle);
                    dynamicData.direction.y = Math.cos(randomElevation);
                    dynamicData.direction.z = Math.sin(randomElevation) * Math.sin(randomAngle);
                    
                    // Normalize direction
                    const length = Math.sqrt(
                        dynamicData.direction.x * dynamicData.direction.x +
                        dynamicData.direction.y * dynamicData.direction.y +
                        dynamicData.direction.z * dynamicData.direction.z
                    );
                    
                    dynamicData.direction.x /= length;
                    dynamicData.direction.y /= length;
                    dynamicData.direction.z /= length;
                    
                    // Increase speed slightly
                    dynamicData.speed += 0.01;
                    
                    // Log direction change
                    console.log('Dynamic point changed direction:', dynamicData.direction);
                }
                
                // Schedule next update
                requestAnimationFrame(() => this.updateDynamicPoint());
            }
            
            createSpawnPoint(pincode) {
                // Generate random position based on dynamic point
                const dynamicPoint = this.physicalWorldReference.referencePoints[4];
                const randomAngle = Math.random() * Math.PI * 2;
                const randomDistance = 5 + Math.random() * 10;
                
                const spawnX = dynamicPoint.x + Math.cos(randomAngle) * randomDistance;
                const spawnY = dynamicPoint.y + (Math.random() - 0.5) * 5;
                const spawnZ = dynamicPoint.z + Math.sin(randomAngle) * randomDistance;
                
                // Create spawn point
                const spawnPoint = {
                    position: { x: spawnX, y: spawnY, z: spawnZ },
                    pincode: pincode,
                    timestamp: Date.now(),
                    label: `Spawn ${this.physicalWorldReference.spawnPoints.length + 1}`
                };
                
                // Add to spawn points
                this.physicalWorldReference.spawnPoints.push(spawnPoint);
                
                // Set as current spawn point
                this.physicalWorldReference.currentSpawnPoint = spawnPoint;
                
                // Create visual representation
                this.createSpawnPointVisual(spawnPoint);
                
                // Expand space
                this.expandSpace();
                
                // Log spawn point creation
                console.log('Spawn point created:', spawnPoint);
                
                // Show notification
                this.showNotification(`New spawn point created: ${spawnPoint.label}`);
                
                return spawnPoint;
            }
            
            createSpawnPointVisual(spawnPoint) {
                // Create spawn point node
                const spawnGeometry = new THREE.SphereGeometry(0.3, 16, 16);
                const spawnMaterial = new THREE.MeshPhongMaterial({
                    color: 0x00ff00,
                    emissive: 0x00ff00,
                    emissiveIntensity: 0.5,
                    transparent: true,
                    opacity: 0.8
                });
                
                const spawnNode = new THREE.Mesh(spawnGeometry, spawnMaterial);
                spawnNode.position.set(spawnPoint.position.x, spawnPoint.position.y, spawnPoint.position.z);
                spawnNode.userData = {
                    type: 'spawn_point',
                    data: spawnPoint
                };
                
                this.spawnPointContainer.add(spawnNode);
                
                // Create label
                const labelGroup = new THREE.Group();
                const labelGeometry = new THREE.PlaneGeometry(1, 0.3);
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 512;
                canvas.height = 64;
                
                context.fillStyle = 'rgba(0, 0, 0, 0)';
                context.fillRect(0, 0, canvas.width, canvas.height);
                
                context.font = '16px Orbitron';
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillStyle = '#00ff00';
                
                context.shadowColor = '#00ff00';
                context.shadowBlur = 10;
                context.shadowOffsetX = 0;
                context.shadowOffsetY = 0;
                
                context.fillText(spawnPoint.label, canvas.width/2, canvas.height/2);
                
                const texture = new THREE.CanvasTexture(canvas);
                texture.needsUpdate = true;
                
                const labelMaterial = new THREE.MeshPhongMaterial({
                    map: texture,
                    transparent: true,
                    opacity: 0.8,
                    side: THREE.DoubleSide
                });
                
                const label = new THREE.Mesh(labelGeometry, labelMaterial);
                label.position.y = 0.3;
                labelGroup.add(label);
                
                labelGroup.position.copy(spawnNode.position);
                labelGroup.position.y += 0.3;
                
                this.spawnPointContainer.add(labelGroup);
                
                // Create connection to reference node
                const connectionGeometry = new THREE.CylinderGeometry(0.02, 0.02, 
                    spawnNode.position.distanceTo(this.referenceNode.position), 8);
                const connectionMaterial = new THREE.MeshPhongMaterial({
                    color: 0x00ff00,
                    emissive: 0x00ff00,
                    emissiveIntensity: 0.3,
                    transparent: true,
                    opacity: 0.4
                });
                const connection = new THREE.Mesh(connectionGeometry, connectionMaterial);
                
                // Position and rotate connection
                const direction = new THREE.Vector3().subVectors(spawnNode.position, this.referenceNode.position);
                const distance = direction.length();
                connection.position.copy(this.referenceNode.position).add(direction.multiplyScalar(0.5));
                connection.lookAt(spawnNode.position);
                connection.rotateX(Math.PI / 2);
                
                this.spawnPointContainer.add(connection);
                
                // Add pulsing animation
                const pulseAnimation = () => {
                    spawnNode.material.opacity = 0.5 + Math.sin(Date.now() * 0.003) * 0.3;
                    spawnNode.material.emissiveIntensity = 0.3 + Math.sin(Date.now() * 0.003) * 0.2;
                    requestAnimationFrame(pulseAnimation);
                };
                pulseAnimation();
                
                return spawnNode;
            }
            
            expandSpace() {
                // Increase space expansion
                this.physicalWorldReference.spaceExpansion += 0.1;
                
                // Update reference node
                if (this.referenceNode) {
                    // Update node size
                    const scale = 1 + (this.physicalWorldReference.spaceExpansion - 1) * 0.2;
                    this.referenceNode.scale.set(scale, scale, scale);
                    
                    // Update user data
                    this.referenceNode.userData.data = this.physicalWorldReference;
                }
                
                // Log space expansion
                console.log('Space expanded:', this.physicalWorldReference.spaceExpansion);
                
                // Show notification
                this.showNotification(`Metaphorical space expanded to ${this.physicalWorldReference.spaceExpansion.toFixed(1)}x`);
                
                // Create memory of space expansion
                const expansionMemory = {
                    type: 'space_expansion',
                    timestamp: Date.now(),
                    data: {
                        expansion: this.physicalWorldReference.spaceExpansion,
                        spawnPoint: this.physicalWorldReference.currentSpawnPoint
                    }
                };
                
                // Store in memory
                this.memoryStorage.push(expansionMemory);
                
                // Create visual representation
                this.createMemoryNode(expansionMemory);
            }
            
            // Override verifyPincode to create spawn point
            verifyPincode(pincode) {
                // Check if pincode is correct
                const isCorrect = pincode === this.secureStorage.pincode;
                
                if (isCorrect) {
                    // Create spawn point
                    this.createSpawnPoint(pincode);
                    
                    // Store last pincode entry
                    this.physicalWorldReference.lastPincodeEntry = {
                        pincode: pincode,
                        timestamp: Date.now()
                    };
                }
                
                return isCorrect;
            }
            
            // Override animate to include physical world reference update
            animate() {
                requestAnimationFrame(() => this.animate());
                
                // Calculate delta time
                const currentTime = performance.now();
                const deltaTime = (currentTime - this.lastFrameTime) / 1000;
                this.lastFrameTime = currentTime;
                
                // Update FPS counter
                this.frameCount++;
                if (currentTime - this.lastFpsUpdate > 1000) {
                    this.fps = this.frameCount;
                    this.frameCount = 0;
                    this.lastFpsUpdate = currentTime;
                }
                
                // Update controls
                this.controls.update();
                
                // Update quantum field
                this.updateQuantumField();
                
                // Update coordinates
                this.updateCoordinates();
                
                // Update time progression
                this.updateTimeProgression();
                
                // Update reality awareness
                this.updateRealityAwareness();
                
                // Update security monitoring
                this.updateSecurityMonitoring();
                
                // Update physical world reference
                this.updatePhysicalWorldReference();
                
                // Render scene
                this.renderer.render(this.scene, this.camera);
            }
            
            updatePhysicalWorldReference() {
                // Update creator position (simulate movement)
                const currentTime = Date.now();
                const timeSinceLastUpdate = (currentTime - this.physicalWorldReference.creator.lastUpdate) / 1000;
                
                // Only update occasionally
                if (timeSinceLastUpdate > 5) {
                    // Generate random movement
                    const randomAngle = Math.random() * Math.PI * 2;
                    const randomDistance = Math.random() * 2;
                    
                    this.physicalWorldReference.creator.position.x += Math.cos(randomAngle) * randomDistance;
                    this.physicalWorldReference.creator.position.z += Math.sin(randomAngle) * randomDistance;
                    this.physicalWorldReference.creator.position.y += (Math.random() - 0.5) * 0.5;
                    
                    // Update creator node
                    if (this.creatorNode) {
                        this.creatorNode.position.copy(this.physicalWorldReference.creator.position);
                    }
                    
                    // Update creator label
                    if (this.creatorLabel) {
                        this.creatorLabel.position.copy(this.physicalWorldReference.creator.position);
                        this.creatorLabel.position.y += 0.3;
                    }
                    
                    // Update last update time
                    this.physicalWorldReference.creator.lastUpdate = currentTime;
                    
                    // Log creator movement
                    console.log('Creator moved to:', this.physicalWorldReference.creator.position);
                }
            }
        }
    </script>
