<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center Access</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #00ffff;
            font-family: 'Orbitron', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ffff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            }
            to {
                box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px #00ffff;
        }

        .loading-bar {
            width: 300px;
            height: 4px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            border-radius: 2px;
            margin: 20px auto;
            overflow: hidden;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            background: #00ffff;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .status-text {
            font-size: 1.2rem;
            margin-top: 1rem;
            text-shadow: 0 0 5px #00ffff;
        }

        @font-face {
            font-family: 'Orbitron';
            src: url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Command Center Access</h1>
        <div class="loading-bar">
            <div class="loading-progress" id="loadingProgress"></div>
        </div>
        <div class="status-text" id="statusText">Initializing system...</div>
    </div>

    <script>
        let progress = 0;
        const progressBar = document.getElementById('loadingProgress');
        const statusText = document.getElementById('statusText');
        const loadingInterval = setInterval(() => {
            if (progress >= 100) {
                clearInterval(loadingInterval);
                statusText.textContent = "Access granted. Redirecting...";
                setTimeout(() => {
                    window.location.href = 'commandcenter.html';
                }, 1000);
            } else {
                progress = Math.min(progress + 1, 100);
                progressBar.style.width = progress + '%';
                statusText.textContent = `System initialization: ${progress}%`;
            }
        }, 20);
    </script>
</body>
</html>
