<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Workspace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a0f;
            color: #00ffc8;
            font-family: 'Arial', sans-serif;
        }

        #workspace-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 2;
            display: flex;
            gap: 10px;
        }

        .coordinates {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-family: 'Arial', monospace;
        }

        .coordinates span {
            display: inline-block;
            min-width: 60px;
            text-align: right;
            margin-left: 5px;
            color: #00ffc8;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
        }

        .coordinates .coord {
            margin: 5px 0;
        }

        button {
            background: rgba(0, 255, 200, 0.2);
            border: 1px solid #00ffc8;
            color: #00ffc8;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(0, 255, 200, 0.4);
        }

        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 2;
            font-size: 14px;
            color: #00ffc8;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .footer:hover {
            opacity: 1;
        }

        .footer span {
            margin: 0 10px;
        }

        .footer .copyright {
            font-size: 12px;
            opacity: 0.7;
        }

        .lucky-clover {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2;
            cursor: pointer;
            font-size: 24px;
            color: #00ffc8;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
            transition: transform 0.3s ease;
        }

        .lucky-clover:hover {
            transform: scale(1.2);
        }

        .lucky-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #00ffc8;
            color: #00ffc8;
            font-size: 18px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
        }

        .lucky-message.visible {
            opacity: 1;
        }

        .warp-button {
            position: fixed;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            background: rgba(0, 255, 200, 0.1);
            border: 2px solid #00ffc8;
            color: #00ffc8;
            padding: 10px 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 2;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 255, 200, 0.4);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(0, 255, 200, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(0, 255, 200, 0);
            }
        }

        .warp-button:hover {
            background: rgba(0, 255, 200, 0.2);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.4);
            animation: none;
        }

        .galaxy-link {
            position: relative;
            text-decoration: none;
        }

        .enter-galaxy {
            position: relative;
            overflow: hidden;
            background: linear-gradient(45deg, rgba(0, 255, 200, 0.2), rgba(0, 255, 200, 0.1));
            border: 1px solid #00ffc8;
            transition: all 0.5s ease;
        }

        .enter-galaxy::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 255, 200, 0.2) 0%, transparent 70%);
            transform: rotate(45deg);
            transition: all 0.5s ease;
            opacity: 0;
        }

        .enter-galaxy:hover {
            background: rgba(0, 255, 200, 0.3);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.4);
        }

        .enter-galaxy:hover::before {
            opacity: 1;
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .galaxy-link::after {
            content: '→';
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: all 0.3s ease;
            color: #00ffc8;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
        }

        .galaxy-link:hover::after {
            opacity: 1;
            right: 0;
        }

        .tech-toggle {
            position: fixed;
            top: 20px;
            right: 200px;
            z-index: 100;
            background: rgba(0, 255, 200, 0.1);
            border: 2px solid #00ffc8;
            color: #00ffc8;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.2);
            text-decoration: none;
            display: inline-block;
        }

        .tech-toggle:hover {
            background: rgba(0, 255, 200, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 200, 0.4);
        }

        .time-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #00ffc8;
            color: #00ffc8;
            font-size: 24px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: all 0.5s ease;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.3);
        }

        .time-message.visible {
            opacity: 1;
        }

        .time-counter {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid #00ffc8;
            color: #00ffc8;
            font-family: 'Arial', monospace;
            font-size: 16px;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
            opacity: 0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
            min-width: 200px;
            justify-content: center;
        }

        .time-segment {
            background: rgba(0, 255, 200, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 200, 0.3);
            min-width: 35px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .time-separator {
            color: rgba(0, 255, 200, 0.5);
            animation: blink 1s infinite;
            margin: 0 2px;
        }

        .time-counter.visible {
            opacity: 1;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 200, 0.2); }
            50% { box-shadow: 0 0 30px rgba(0, 255, 200, 0.4); }
        }

        .mind-control {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px solid rgba(0, 255, 200, 0.3);
            border-radius: 50%;
            opacity: 0;
            transition: all 0.5s ease;
            pointer-events: none;
            z-index: 99;
        }

        .mind-control.visible {
            opacity: 0.3;
            animation: mindPulse 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes mindPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="lucky-clover">🍀</div>
    <div class="lucky-message">That will be 4 dollars please.</div>
    <div class="time-message">Time is on your side</div>
    <div class="time-counter">
        <div class="time-segment hours">00</div>
        <div class="time-separator">:</div>
        <div class="time-segment minutes">00</div>
        <div class="time-separator">:</div>
        <div class="time-segment seconds">00</div>
    </div>
    <div class="mind-control"></div>

    <a href="tech-environment.html" class="tech-toggle">Enter Tech Environment</a>

    <canvas id="workspace-canvas"></canvas>

    <a href="/warp/index.html" class="warp-link">
        <button class="warp-button">WARP</button>
    </a>

    <div class="controls">
        <button class="add-window">Add Window</button>
        <button class="view-front">Front View</button>
        <button class="view-top">Top View</button>
        <button class="view-side">Side View</button>
        <button class="toggle-grid">Toggle Grid</button>
        <a href="galaxy-workspace/index.html" class="galaxy-link">
            <button class="enter-galaxy">Enter Galaxy</button>
        </a>
    </div>

    <div class="coordinates">
        <div class="coord">X: <span>0.00</span></div>
        <div class="coord">Y: <span>0.00</span></div>
        <div class="coord">Z: <span>0.00</span></div>
    </div>

    <div class="footer">
        <span class="copyright">© 2024</span>
        <span>MarX W</span>
    </div>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
    
    <!-- Your workspace script -->
    <script src="script.js"></script>
    <script src="lucky-clover.js"></script>
    <script>
        // Performance Monitoring
        const performanceMetrics = {
            pageLoadTime: 0,
            userInteractions: 0,
            timeInSpace: 0,
            lastInteraction: Date.now()
        };

        // Track page load performance
        window.addEventListener('load', () => {
            performanceMetrics.pageLoadTime = performance.now();
            console.log(`Page loaded in ${performanceMetrics.pageLoadTime}ms`);
        });

        // Track user interactions
        document.addEventListener('click', () => {
            performanceMetrics.userInteractions++;
            performanceMetrics.lastInteraction = Date.now();
        });

        // Track time spent in space
        setInterval(() => {
            performanceMetrics.timeInSpace++;
        }, 1000);

        // Track viewport changes
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                console.log('Viewport changed:', {
                    width: window.innerWidth,
                    height: window.innerHeight
                });
            }, 250);
        });

        // Track navigation events
        document.addEventListener('visibilitychange', () => {
            console.log('Page visibility changed:', document.visibilityState);
        });

        // Track performance marks
        performance.mark('pageStart');
        window.addEventListener('load', () => {
            performance.mark('pageEnd');
            performance.measure('pageLoad', 'pageStart', 'pageEnd');
            const pageLoadMeasure = performance.getEntriesByName('pageLoad')[0];
            console.log('Page load performance:', pageLoadMeasure);
        });

        // Track resource loading
        const observer = new PerformanceObserver((list) => {
            list.getEntries().forEach(entry => {
                if (entry.initiatorType === 'img') {
                    console.log('Image loaded:', {
                        name: entry.name,
                        duration: entry.duration
                    });
                }
            });
        });
        observer.observe({ entryTypes: ['resource'] });

        let startTime;
        let timerInterval;
        let mindControlActive = false;
        let inactivityTimer;
        let lastActivityTime;
        const INACTIVITY_TIMEOUT = 10000; // 10 seconds of inactivity before deactivation
        const timeMessage = document.querySelector('.time-message');
        const timeCounter = document.querySelector('.time-counter');
        const mindControl = document.querySelector('.mind-control');
        const hoursSegment = document.querySelector('.hours');
        const minutesSegment = document.querySelector('.minutes');
        const secondsSegment = document.querySelector('.seconds');

        function deactivateMindControl() {
            mindControlActive = false;
            mindControl.classList.remove('visible');
            mindControl.style.transform = 'translate(-50%, -50%)';
            document.querySelector('.controls').style.transform = 'none';
            clearInterval(inactivityTimer);
            
            // Stop and fade out the timer
            clearInterval(timerInterval);
            timeCounter.classList.remove('visible');
            timeCounter.style.opacity = '0';
            timeCounter.style.transform = 'translateX(-50%) translateY(-20px)';
        }

        function updateActivity() {
            lastActivityTime = Date.now();
            if (!mindControlActive) {
                mindControlActive = true;
                mindControl.classList.add('visible');
                // Restart timer if it was stopped
                if (!timerInterval) {
                    startTime = new Date();
                    timeCounter.classList.add('visible');
                    timeCounter.style.opacity = '1';
                    timeCounter.style.transform = 'translateX(-50%) translateY(0)';
                    timerInterval = setInterval(() => {
                        const currentTime = new Date();
                        const elapsedTime = new Date(currentTime - startTime);
                        const hours = elapsedTime.getUTCHours().toString().padStart(2, '0');
                        const minutes = elapsedTime.getUTCMinutes().toString().padStart(2, '0');
                        const seconds = elapsedTime.getUTCSeconds().toString().padStart(2, '0');
                        
                        hoursSegment.textContent = hours;
                        minutesSegment.textContent = minutes;
                        secondsSegment.textContent = seconds;
                    }, 1000);
                }
            }
        }

        // Check if returning from tech environment
        if (localStorage.getItem('returnFromTech') === 'true') {
            // Show message
            timeMessage.classList.add('visible');
            
            // Start timer
            startTime = new Date();
            timeCounter.classList.add('visible');
            mindControl.classList.add('visible');
            mindControlActive = true;
            lastActivityTime = Date.now();
            
            // Update timer every second
            timerInterval = setInterval(() => {
                const currentTime = new Date();
                const elapsedTime = new Date(currentTime - startTime);
                const hours = elapsedTime.getUTCHours().toString().padStart(2, '0');
                const minutes = elapsedTime.getUTCMinutes().toString().padStart(2, '0');
                const seconds = elapsedTime.getUTCSeconds().toString().padStart(2, '0');
                
                hoursSegment.textContent = hours;
                minutesSegment.textContent = minutes;
                secondsSegment.textContent = seconds;
            }, 1000);

            // Hide message after 3 seconds
            setTimeout(() => {
                timeMessage.classList.remove('visible');
            }, 3000);

            // Clear the flag
            localStorage.removeItem('returnFromTech');
        }

        // Mind control navigation
        if (mindControlActive) {
            document.addEventListener('mousemove', (e) => {
                updateActivity();
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                const deltaX = (e.clientX - centerX) / centerX;
                const deltaY = (e.clientY - centerY) / centerY;

                // Move the mind control circle
                mindControl.style.transform = `translate(${deltaX * 100}px, ${deltaY * 100}px)`;

                // Control navigation based on position
                if (Math.abs(deltaX) > 0.5) {
                    // Horizontal movement
                    document.querySelector('.controls').style.transform = `translateX(${deltaX * 20}px)`;
                }
                if (Math.abs(deltaY) > 0.5) {
                    // Vertical movement
                    document.querySelector('.controls').style.transform = `translateY(${deltaY * 20}px)`;
                }
            });

            // Start inactivity timer
            inactivityTimer = setInterval(() => {
                const currentTime = Date.now();
                if (currentTime - lastActivityTime > INACTIVITY_TIMEOUT) {
                    deactivateMindControl();
                }
            }, 1000);
        }
    </script>
</body>
</html>
