<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The New Universe - A Vision of Infinite Possibilities by MarX Björn Wiström">
    <meta name="author" content="MarX Björn Wiström">
    <title>The New Universe | MarX W</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
    
    <!-- Styles -->
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background: #000;
            color: #00ffc8;
            overflow: hidden;
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-text {
            font-size: 24px;
            color: #00ffc8;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
        }

        /* Main Content */
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: none;
        }

        #workspace-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 2;
            display: flex;
            gap: 10px;
        }

        .coordinates {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-family: 'Arial', monospace;
        }

        .coordinates span {
            display: inline-block;
            min-width: 60px;
            text-align: right;
            margin-left: 5px;
            color: #00ffc8;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
        }

        .coordinates .coord {
            margin: 5px 0;
        }

        button {
            background: rgba(0, 255, 200, 0.2);
            border: 1px solid #00ffc8;
            color: #00ffc8;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(0, 255, 200, 0.4);
        }

        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 2;
            font-size: 14px;
            color: #00ffc8;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .footer:hover {
            opacity: 1;
        }

        .footer span {
            margin: 0 10px;
        }

        .footer .copyright {
            font-size: 12px;
            opacity: 0.7;
        }

        .lucky-clover {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2;
            cursor: pointer;
            font-size: 24px;
            color: #00ffc8;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
            transition: transform 0.3s ease;
        }

        .lucky-clover:hover {
            transform: scale(1.2);
        }

        .lucky-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #00ffc8;
            color: #00ffc8;
            font-size: 18px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
        }

        .lucky-message.visible {
            opacity: 1;
        }

        .warp-button {
            position: fixed;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            background: rgba(0, 255, 200, 0.1);
            border: 2px solid #00ffc8;
            color: #00ffc8;
            padding: 10px 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 2;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 255, 200, 0.4);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(0, 255, 200, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(0, 255, 200, 0);
            }
        }

        .warp-button:hover {
            background: rgba(0, 255, 200, 0.2);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.4);
            animation: none;
        }

        .galaxy-link {
            position: relative;
            text-decoration: none;
        }

        .enter-galaxy {
            position: relative;
            overflow: hidden;
            background: linear-gradient(45deg, rgba(0, 255, 200, 0.2), rgba(0, 255, 200, 0.1));
            border: 1px solid #00ffc8;
            transition: all 0.5s ease;
        }

        .enter-galaxy::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 255, 200, 0.2) 0%, transparent 70%);
            transform: rotate(45deg);
            transition: all 0.5s ease;
            opacity: 0;
        }

        .enter-galaxy:hover {
            background: rgba(0, 255, 200, 0.3);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.4);
        }

        .enter-galaxy:hover::before {
            opacity: 1;
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .galaxy-link::after {
            content: '→';
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: all 0.3s ease;
            color: #00ffc8;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
        }

        .galaxy-link:hover::after {
            opacity: 1;
            right: 0;
        }

        .tech-toggle {
            position: fixed;
            top: 20px;
            right: 200px;
            z-index: 100;
            background: rgba(0, 255, 200, 0.1);
            border: 2px solid #00ffc8;
            color: #00ffc8;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 200, 0.2);
            text-decoration: none;
            display: inline-block;
        }

        .tech-toggle:hover {
            background: rgba(0, 255, 200, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 255, 200, 0.4);
        }

        .time-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #00ffc8;
            color: #00ffc8;
            font-size: 24px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: all 0.5s ease;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.3);
        }

        .time-message.visible {
            opacity: 1;
        }

        .time-counter {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid #00ffc8;
            color: #00ffc8;
            font-family: 'Arial', monospace;
            font-size: 16px;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
            opacity: 0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
            min-width: 200px;
            justify-content: center;
        }

        .time-segment {
            background: rgba(0, 255, 200, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 200, 0.3);
            min-width: 35px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .time-separator {
            color: rgba(0, 255, 200, 0.5);
            animation: blink 1s infinite;
            margin: 0 2px;
        }

        .time-counter.visible {
            opacity: 1;
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 200, 0.2); }
            50% { box-shadow: 0 0 30px rgba(0, 255, 200, 0.4); }
        }

        .mind-control {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border: 2px solid rgba(0, 255, 200, 0.3);
            border-radius: 50%;
            opacity: 0;
            transition: all 0.5s ease;
            pointer-events: none;
            z-index: 99;
        }

        .mind-control.visible {
            opacity: 0.3;
            animation: mindPulse 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes mindPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Camera Controls */
        .camera-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }

        .camera-controls button {
            background: rgba(0, 255, 200, 0.2);
            border: 1px solid #00ffc8;
            color: #00ffc8;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .camera-controls button:hover {
            background: rgba(0, 255, 200, 0.4);
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen">
        <div class="loading-text">Initializing The New Universe...</div>
    </div>

    <!-- Main Application Container -->
    <div id="app">
        <div class="lucky-clover">🍀</div>
        <div class="lucky-message">That will be 4 dollars please.</div>
        <div class="time-message">Time is on your side</div>
        <div class="time-counter">
            <div class="time-segment hours">00</div>
            <div class="time-separator">:</div>
            <div class="time-segment minutes">00</div>
            <div class="time-separator">:</div>
            <div class="time-segment seconds">00</div>
        </div>
        <div class="mind-control"></div>

        <a href="tech-environment.html" class="tech-toggle">Enter Tech Environment</a>

        <canvas id="workspace-canvas"></canvas>

        <a href="/warp/index.html" class="warp-link">
            <button class="warp-button">WARP</button>
        </a>

        <div class="controls">
            <button class="add-window">Add Window</button>
            <button class="view-front">Front View</button>
            <button class="view-top">Top View</button>
            <button class="view-side">Side View</button>
            <button class="toggle-grid">Toggle Grid</button>
            <a href="galaxy-workspace/index.html" class="galaxy-link">
                <button class="enter-galaxy">Enter Galaxy</button>
            </a>
        </div>

        <div class="coordinates">
            <div class="coord">X: <span>0.00</span></div>
            <div class="coord">Y: <span>0.00</span></div>
            <div class="coord">Z: <span>0.00</span></div>
        </div>

        <div class="footer">
            <span class="copyright">© 2024</span>
            <span>MarX W</span>
        </div>

        <!-- Camera Controls -->
        <div class="camera-controls">
            <button class="reset-camera">Reset View</button>
            <button class="toggle-auto-rotate">Auto Rotate</button>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Loading Screen Handler
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.querySelector('.loading-screen').style.opacity = '0';
                document.getElementById('app').style.display = 'block';
                setTimeout(() => {
                    document.querySelector('.loading-screen').style.display = 'none';
                }, 1000);
            }, 2000);
        });

        // Initialize Application
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Three.js scene
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('workspace-canvas'),
                antialias: true,
                alpha: true
            });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;

            // Setup camera
            camera.position.set(5, 5, 5);
            camera.lookAt(0, 0, 0);

            // Setup controls
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = true;
            controls.minDistance = 1;
            controls.maxDistance = 100;
            controls.maxPolarAngle = Math.PI / 2;

            // Add ambient light
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            // Add directional light
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 5, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Add point light for grid illumination
            const pointLight = new THREE.PointLight(0x00ffc8, 1, 100);
            pointLight.position.set(0, 5, 0);
            pointLight.castShadow = true;
            scene.add(pointLight);

            // Add spotlight for focused grid lighting
            const spotLight = new THREE.SpotLight(0x00ffc8, 1);
            spotLight.position.set(10, 10, 10);
            spotLight.angle = Math.PI / 4;
            spotLight.penumbra = 0.1;
            spotLight.decay = 2;
            spotLight.distance = 100;
            spotLight.castShadow = true;
            scene.add(spotLight);

            // Add a test cube to verify rendering
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshPhongMaterial({
                color: 0x00ffc8,
                emissive: 0x00ffc8,
                emissiveIntensity: 0.5
            });
            const cube = new THREE.Mesh(geometry, material);
            cube.castShadow = true;
            cube.receiveShadow = true;
            scene.add(cube);

            // Add a ground plane to show shadows
            const groundGeometry = new THREE.PlaneGeometry(20, 20);
            const groundMaterial = new THREE.MeshPhongMaterial({
                color: 0x111111,
                side: THREE.DoubleSide
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            scene.add(ground);

            // Add multiple grids
            const gridHelper = new THREE.GridHelper(20, 20, 0x00ffc8, 0x00ffc8);
            gridHelper.material.opacity = 0.2;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            // Create multiple grid layers
            for (let i = 0; i < 1000; i++) {
                const grid = new THREE.GridHelper(20, 20, 0x00ffc8, 0x00ffc8);
                grid.material.opacity = 0.1;
                grid.material.transparent = true;
                
                // Position grids in a sphere pattern
                const radius = 10 + (i * 0.5);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                
                grid.position.x = radius * Math.sin(phi) * Math.cos(theta);
                grid.position.y = radius * Math.sin(phi) * Math.sin(theta);
                grid.position.z = radius * Math.cos(phi);
                
                grid.rotation.x = Math.random() * Math.PI;
                grid.rotation.y = Math.random() * Math.PI;
                
                scene.add(grid);
            }

            // Add quantum particles
            const particleCount = 1000;
            const particleGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                positions[i3] = (Math.random() - 0.5) * 50;
                positions[i3 + 1] = (Math.random() - 0.5) * 50;
                positions[i3 + 2] = (Math.random() - 0.5) * 50;

                colors[i3] = 0;
                colors[i3 + 1] = 1;
                colors[i3 + 2] = 0.8;
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const particleMaterial = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            const particles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particles);

            // Add quantum field effect
            const fieldGeometry = new THREE.SphereGeometry(15, 32, 32);
            const fieldMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    color: { value: new THREE.Color(0x00ffc8) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    uniform vec3 color;
                    varying vec2 vUv;

                    void main() {
                        float pulse = sin(time * 2.0 + vUv.x * 10.0) * 0.5 + 0.5;
                        vec3 finalColor = color * (0.5 + pulse * 0.5);
                        float alpha = 0.2 + pulse * 0.1;
                        gl_FragColor = vec4(finalColor, alpha);
                    }
                `,
                transparent: true,
                side: THREE.DoubleSide
            });

            const quantumField = new THREE.Mesh(fieldGeometry, fieldMaterial);
            scene.add(quantumField);

            // Add quantum portals
            for (let i = 0; i < 5; i++) {
                const portalGeometry = new THREE.RingGeometry(1, 1.5, 32);
                const portalMaterial = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0 },
                        color: { value: new THREE.Color(0x00ffc8) }
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform float time;
                        uniform vec3 color;
                        varying vec2 vUv;

                        void main() {
                            float angle = atan(vUv.x - 0.5, vUv.y - 0.5);
                            float radius = length(vUv - vec2(0.5));
                            float pulse = sin(time * 3.0 + angle * 10.0) * 0.5 + 0.5;
                            vec3 finalColor = color * (0.5 + pulse * 0.5);
                            float alpha = 0.3 + pulse * 0.2;
                            gl_FragColor = vec4(finalColor, alpha);
                        }
                    `,
                    transparent: true,
                    side: THREE.DoubleSide
                });

                const portal = new THREE.Mesh(portalGeometry, portalMaterial);
                portal.position.set(
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 20,
                    (Math.random() - 0.5) * 20
                );
                portal.rotation.x = Math.random() * Math.PI;
                portal.rotation.y = Math.random() * Math.PI;
                scene.add(portal);
            }

            // Add special grid at specific coordinates
            const specialGrid = new THREE.GridHelper(30, 30, 0x00ffc8, 0x00ffc8);
            specialGrid.material.opacity = 0.3;
            specialGrid.material.transparent = true;
            specialGrid.position.set(567.23, 164.13, 239.88);
            
            // Add glow effect to the special grid
            const gridGlow = new THREE.PointLight(0x00ffc8, 2, 50);
            gridGlow.position.copy(specialGrid.position);
            gridGlow.castShadow = true;
            
            // Add particle effect around the special grid
            const gridParticles = new THREE.Points(
                new THREE.BufferGeometry(),
                new THREE.PointsMaterial({
                    color: 0x00ffc8,
                    size: 0.2,
                    transparent: true,
                    opacity: 0.8
                })
            );
            
            const particlePositions = new Float32Array(1000 * 3);
            for (let i = 0; i < 1000; i++) {
                const i3 = i * 3;
                particlePositions[i3] = specialGrid.position.x + (Math.random() - 0.5) * 20;
                particlePositions[i3 + 1] = specialGrid.position.y + (Math.random() - 0.5) * 20;
                particlePositions[i3 + 2] = specialGrid.position.z + (Math.random() - 0.5) * 20;
            }
            
            gridParticles.geometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            gridParticles.position.copy(specialGrid.position);
            
            scene.add(specialGrid);
            scene.add(gridGlow);
            scene.add(gridParticles);

            // Update animation loop to include new elements
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                
                // Animate lights
                const time = Date.now() * 0.001;
                pointLight.position.x = Math.sin(time) * 3;
                pointLight.position.z = Math.cos(time) * 3;
                spotLight.position.x = Math.cos(time) * 10;
                spotLight.position.z = Math.sin(time) * 10;
                
                // Animate special grid particles
                const gridParticlePositions = gridParticles.geometry.attributes.position.array;
                for (let i = 0; i < gridParticlePositions.length; i += 3) {
                    gridParticlePositions[i] += Math.sin(time + i) * 0.02;
                    gridParticlePositions[i + 1] += Math.cos(time + i) * 0.02;
                    gridParticlePositions[i + 2] += Math.sin(time + i) * 0.02;
                }
                gridParticles.geometry.attributes.position.needsUpdate = true;
                
                // Animate special grid glow
                gridGlow.intensity = 1 + Math.sin(time * 2) * 0.5;
                
                // Animate particles
                const particlePositions = particles.geometry.attributes.position.array;
                for (let i = 0; i < particlePositions.length; i += 3) {
                    particlePositions[i] += Math.sin(time + i) * 0.01;
                    particlePositions[i + 1] += Math.cos(time + i) * 0.01;
                    particlePositions[i + 2] += Math.sin(time + i) * 0.01;
                }
                particles.geometry.attributes.position.needsUpdate = true;
                
                // Animate quantum field
                quantumField.material.uniforms.time.value = time;
                quantumField.rotation.y = time * 0.2;
                
                // Animate portals
                scene.children.forEach(child => {
                    if (child instanceof THREE.Mesh && child !== quantumField) {
                        child.rotation.z += 0.01;
                        child.material.uniforms.time.value = time;
                    }
                });
                
                renderer.render(scene, camera);
            }

            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Camera controls
            document.querySelector('.reset-camera').addEventListener('click', () => {
                camera.position.set(5, 5, 5);
                camera.lookAt(0, 0, 0);
                controls.reset();
            });

            let autoRotate = false;
            document.querySelector('.toggle-auto-rotate').addEventListener('click', () => {
                autoRotate = !autoRotate;
                controls.autoRotate = autoRotate;
                document.querySelector('.toggle-auto-rotate').textContent = 
                    autoRotate ? 'Stop Rotation' : 'Auto Rotate';
            });

            // Start animation
            animate();
        });
    </script>

    <!-- Main Application Script -->
    <script src="script.js"></script>
</body>
</html>
