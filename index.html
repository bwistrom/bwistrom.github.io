<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Workspace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a0f;
            color: #00ffc8;
            font-family: 'Arial', sans-serif;
        }

        #workspace-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 2;
            display: flex;
            gap: 10px;
        }

        .coordinates {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-family: 'Arial', monospace;
        }

        .coordinates span {
            display: inline-block;
            min-width: 60px;
            text-align: right;
            margin-left: 5px;
            color: #00ffc8;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
        }

        .coordinates .coord {
            margin: 5px 0;
        }

        button {
            background: rgba(0, 255, 200, 0.2);
            border: 1px solid #00ffc8;
            color: #00ffc8;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(0, 255, 200, 0.4);
        }

        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 2;
            font-size: 14px;
            color: #00ffc8;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .footer:hover {
            opacity: 1;
        }

        .footer span {
            margin: 0 10px;
        }

        .footer .copyright {
            font-size: 12px;
            opacity: 0.7;
        }

        .lucky-clover {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2;
            cursor: pointer;
            font-size: 24px;
            color: #00ffc8;
            text-shadow: 0 0 10px rgba(0, 255, 200, 0.5);
            transition: transform 0.3s ease;
        }

        .lucky-clover:hover {
            transform: scale(1.2);
        }

        .lucky-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #00ffc8;
            color: #00ffc8;
            font-size: 18px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.5);
        }

        .lucky-message.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="lucky-clover">🍀</div>
    <div class="lucky-message">That will be 4 dollars please.</div>

    <canvas id="workspace-canvas"></canvas>

    <div class="controls">
        <button class="add-window">Add Window</button>
        <button class="view-front">Front View</button>
        <button class="view-top">Top View</button>
        <button class="view-side">Side View</button>
        <button class="toggle-grid">Toggle Grid</button>
    </div>

    <div class="coordinates">
        <div class="coord">X: <span>0.00</span></div>
        <div class="coord">Y: <span>0.00</span></div>
        <div class="coord">Z: <span>0.00</span></div>
    </div>

    <div class="footer">
        <span class="copyright">© 2024</span>
        <span>MarX W</span>
    </div>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
    
    <!-- Your workspace script -->
    <script src="script.js"></script>
    <script src="lucky-clover.js"></script>
</body>
</html>
